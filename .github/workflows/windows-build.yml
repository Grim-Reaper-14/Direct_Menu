name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Run smoke tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Package release
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/assets | Out-Null
          New-Item -ItemType Directory -Force package/Source | Out-Null
          Copy-Item build/Release/Direct_Menu.exe package/Direct_Menu.exe
          if (Test-Path build/Release/assets) {
            Copy-Item build/Release/assets package/assets -Recurse -Force
          }
          Copy-Item CMakeLists.txt package/Source/CMakeLists.txt
          Copy-Item CMakePresets.json package/Source/CMakePresets.json
          Copy-Item README.md package/Source/README.md
          Copy-Item build_windows.bat package/Source/build_windows.bat
          Copy-Item src package/Source/src -Recurse
          Copy-Item tests package/Source/tests -Recurse
          Copy-Item assets package/Source/assets -Recurse

      - name: Upload executable
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Direct_Menu-Windows-x64
          path: package
          if-no-files-found: error
