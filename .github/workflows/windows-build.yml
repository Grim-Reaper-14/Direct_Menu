name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build release
        run: cmake --build --preset windows-release

      - name: Run smoke tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/assets | Out-Null
          Copy-Item build/Release/Direct_Menu.exe package/Direct_Menu.exe
          Copy-Item build/Release/assets/direct_menu_neon_background.jpg package/assets/direct_menu_neon_background.jpg

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Direct_Menu-Windows-x64
          path: package
          if-no-files-found: error
